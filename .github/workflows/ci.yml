name: Validate extension

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes libglib2.0-bin zip

      - name: Compile GSettings schema
        run: glib-compile-schemas --strict schemas

      - name: Build extension archive
        run: |
          zip -r ytrawl.zip extension.js prefs.js metadata.json stylesheet.css lib schemas LICENSE

      - name: Upload extension archive
        uses: actions/upload-artifact@v4
        with:
          name: ytrawl-extension
          path: ytrawl.zip
          if-no-files-found: error
